<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="InternTrack - Internship application, logbook and attendance tracker">
  <meta name="author" content="Nur Husna">
  <title>Login | InternTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
</head>
<body class="login-page">

  <main class="container d-flex flex-column justify-content-center min-vh-100 py-4">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-lg border-0 login-card">
          <div class="card-body p-4 p-md-5">

            <h1 class="h3 text-center fw-bold brand-text mb-1">InternTrack</h1>
            <p class="text-center text-muted mb-4">Internship Management System</p>

            <!-- ===== LOGIN PANEL ===== -->
            <section id="loginPanel">
              <div id="infoMsg" class="alert alert-success d-none" role="alert"></div>
              <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>

              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="username" class="form-label">Username</label>
                  <input type="text" class="form-control" id="username" value="intern" placeholder="Enter username" autocomplete="username" required>
                </div>
                <div class="mb-4">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" value="intern123" placeholder="Enter password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-brand w-100 py-2" autofocus>Login</button>
              </form>

              <p class="small text-center mt-3 mb-1">
                New here? <a href="#" id="showRegister">Create an account</a>
              </p>
              <p class="small text-muted text-center mb-0">
                Demo account is pre-filled. Just press <strong>Login</strong>.
              </p>
            </section>

            <!-- ===== REGISTER PANEL ===== -->
            <section id="registerPanel" class="d-none">
              <div id="regMsg" class="alert alert-danger d-none" role="alert"></div>

              <form id="registerForm" novalidate>
                <div class="mb-3">
                  <label for="regUser" class="form-label">Full name</label>
                  <input type="text" class="form-control" id="regUser" placeholder="e.g. NUR AINA BINTI ALI" autocomplete="username" required>
                </div>
                <div class="mb-3">
                  <label for="regPass" class="form-label">Password</label>
                  <input type="password" class="form-control" id="regPass" placeholder="At least 6 characters" autocomplete="new-password" required>
                </div>
                <div class="mb-4">
                  <label for="regPass2" class="form-label">Confirm password</label>
                  <input type="password" class="form-control" id="regPass2" placeholder="Repeat password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-brand w-100 py-2">Register</button>
              </form>

              <p class="small text-center mt-3 mb-0">
                Already have an account? <a href="#" id="showLogin">Back to login</a>
              </p>
            </section>

          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-white-50 small py-3 login-footer">
    &copy; 2026 InternTrack | IMS566 Individual Project | Universiti Teknologi MARA
  </footer>

  <script src="js/auth.js"></script><script src="js/nav.js"></script>
</body>
</html>
